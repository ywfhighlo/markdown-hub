name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Compile TypeScript
        run: npm run compile

      - name: Lint
        run: npm run lint
        continue-on-error: true  # lint warnings shouldn't block CI for now

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: markdown-hub-out
          path: out/
          retention-days: 7

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -d backend/tests ]; then
            python -m pytest backend/tests/ -v
          else
            echo "No tests directory found — skipping."
          fi
