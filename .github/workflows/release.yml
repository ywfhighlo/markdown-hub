name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on tags matching v*, e.g. v0.4.0, v1.0.0

jobs:
  release:
    name: Build & Publish to VS Code Marketplace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npx @vscode/vsce package
        env:
          VSCE_SKIP_PUBLISHER_CHECK: 'true'  # in case publisher name needs leniency

      - name: Publish to Marketplace
        run: npx @vscode/vsce publish --no-git-tag-version
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Upload VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
